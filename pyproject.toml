[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wasserstein-causal-forests"
version = "0.1.0"
description = "Research prototypes for causal learning with distribution-valued outcomes"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
test = ["pytest>=7"]
# PTA-BCF scalar heads. Pinned because WP2-B1 requires a fixed MIT revision.
pta = ["stochtree==0.4.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

